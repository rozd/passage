name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [ main ] }

jobs:
  unit-tests:
    permissions:
      contents: read
    uses: vapor/ci/.github/workflows/run-unit-tests.yml@main
    with:
      with_tsan: false
      with_api_check: false
      # Skip AAL1 conformance suites (Tests/PassageTests/AAL1, see docs/AAL1/).
      # Their suite IDs all start with "AAL1 "; this lookahead keeps everything else.
      test_filter: '^(?!.*AAL1).+$'
    secrets: inherit

  submit-dependencies:
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' }}
    uses: vapor/ci/.github/workflows/submit-deps.yml@main
    secrets: inherit
